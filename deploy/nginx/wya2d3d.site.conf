# Nginx virtual host for https://wya2d3d.site
#
# Install:
#   sudo cp deploy/nginx/wya2d3d.site.conf /etc/nginx/sites-available/wya2d3d.site
#   sudo ln -s /etc/nginx/sites-available/wya2d3d.site /etc/nginx/sites-enabled/wya2d3d.site
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wya2d3d.site -d www.wya2d3d.site
#
# certbot rewrites this file: it adds the 443 server block, the certificate
# paths and the 80 -> 443 redirect. Keep the two server names identical in the
# DNS zone and in the certbot -d list, otherwise HTTPS validates one host and
# the other still serves the plain HTTP block.

server {
    listen 80;
    listen [::]:80;

    server_name wya2d3d.site www.wya2d3d.site;

    # Only public/ is ever exposed; .env, storage/ and the source stay above it.
    root /var/www/thai2d3d/public;
    index index.php;
    charset utf-8;

    # The Admin publishes the Agent APK from Settings (up to 120 MB). Nginx
    # rejects bodies over its 1 MB default with a 413 before Laravel sees the
    # upload, and php.ini then needs the same raise:
    #   printf 'upload_max_filesize = 130M\npost_max_size = 135M\n' \
    #     | sudo tee /etc/php/8.3/fpm/conf.d/99-wya-uploads.ini
    #   sudo systemctl reload php8.3-fpm
    client_max_body_size 130M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Block dotfiles but keep /.well-known reachable, or Let's Encrypt HTTP-01
    # challenges 403 and the certificate can never be issued or renewed.
    location ~ /\.well-known/acme-challenge/ {
        allow all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
